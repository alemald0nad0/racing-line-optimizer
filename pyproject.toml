[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racing-line-optimizer"
version = "0.1.0"
description = "Optimization and simulation tools for computing racing lines."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "alemald0nad0" }
]
keywords = [
    "motorsport",
    "optimization",
    "racing-line",
    "vehicle-dynamics",
    "optimal-control"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/racing_line"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
